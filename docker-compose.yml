services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      JSON_SERVER_URL: "http://json-server:3001"
    depends_on:
      - json-server

  json-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - npx
      - json-server
      - --watch
      - data/data.json
      - --host
      - 0.0.0.0
      - --port
      - "3001"
    ports:
      - "3001:3001"
